name: CI

# One run per commit (push only; a PR shows the run of its head commit), on the
# GCP runners (self-hosted, meritum). A newer push to the same branch cancels it,
# never on main.
# Delivery: main keeps the zip, built against https://meritum.gburek.app, as the run
# artifact `meritum-extension-prd`; load it unpacked in chrome://extensions.
# No store publishing.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, meritum]
    timeout-minutes: 15
    concurrency:
      group: ci-verify-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # pnpm from npm (version from packageManager); the store stays on the runner.
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm biome ci --reporter=github --error-on-warnings .
      - run: pnpm typecheck # tsc strict
      - run: pnpm test # unit tests, tests/architecture (JSDoc @feature, constants, 250 lines), design-system copy sums
      - run: pnpm depcruise # import boundaries (.dependency-cruiser.cjs)
      - run: pnpm knip # dead code and unused dependencies
      - run: pnpm zip
      - name: Keep the zip
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meritum-extension-prd
          path: .output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true # WXT writes to .output/, which upload-artifact skips by default
          retention-days: 30
